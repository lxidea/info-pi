<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=440, initial-scale=1.0">
    <title>Info-Pi</title>
    <link rel="stylesheet" href="/static/css/dashboard.css?v={{ ver }}">
</head>
<body>
    <div class="dashboard">

        <!-- P1: Clock -->
        <section class="panel p-clock">
            <div class="clk-time" id="time">--:--</div>
            <div class="clk-date-block">
                <div class="clk-date" id="date"></div>
                <div class="clk-sub">
                    <span id="lunar-date"></span>
                    <span class="dot-sep"></span>
                    <span id="day"></span>
                </div>
            </div>
            <div class="clk-world" id="world-clocks"></div>
        </section>

        <!-- P2: Weather -->
        <section class="panel p-weather">
            <div class="wx-top">
                <div class="wx-hero">
                    <div class="wx-hero-row">
                        <div class="wx-icon-svg" id="w-icon"></div>
                        <div class="wx-temp" id="w-temp">--°</div>
                    </div>
                    <div class="wx-desc" id="w-desc"></div>
                </div>
                <div class="wx-metrics" id="w-metrics"></div>
            </div>
            <div class="wx-rain" id="w-rain" style="display:none"></div>
            <div class="wx-chart" id="w-hourly"></div>
            <div class="wx-forecast" id="w-forecast"></div>
        </section>

        <!-- P3: Calendar -->
        <section class="panel p-cal">
            <div class="cal-grid-wrap" id="calendar-body"></div>
            <div class="cal-holidays" id="cal-holidays"></div>
        </section>

        <!-- P4: Observatory -->
        <section class="panel p-obs">
            <div class="obs-sky" id="sky-arc"></div>
            <div class="obs-info" id="obs-info"></div>
            <div class="obs-sys" id="status-bar"></div>
        </section>

    </div>
    <script src="/static/js/dashboard.js?v={{ ver }}"></script>
</body>
</html>
